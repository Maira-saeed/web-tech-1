
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Calculator</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="calculator">

        <div class="header">
            <span>Calculator</span>
            <span class="menu">☰</span>
        </div>

        <div class="mode">Standard</div>

        <div class="display">
            <div id="expression"></div>
            <div id="result">0</div>
        </div>

        <div class="buttons">
            <button class="function" data-action="percent">%</button>
            <button class="function" data-action="clear-entry">CE</button>
            <button class="function" data-action="clear">C</button>
            <button class="function" data-action="backspace">⌫</button>

            <button class="function" data-action="reciprocal">¹/x</button>
            <button class="function" data-action="square">x²</button>
            <button class="function" data-action="sqrt">√x</button>
            <button class="operator" data-operator="/">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="*">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="-">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operator="+">+</button>

            <button data-action="sign">+/−</button>
            <button data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="equals" data-action="equals">=</button>
        </div>

    </div>

</body>
</html>
