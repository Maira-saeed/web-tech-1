
<html>

<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="green.css">
</head>

<body>

<div id="header">
    <h1>Student Registration Portal</h1>
</div>

<div id="menu">
    <a href="first-green.html">Login</a>
    <a href="second-green.html">Registration</a>
    <a href="third-green.html">Thank You</a>
</div>

<div id="main">

    <h2>Login</h2>

    <div class="login-box">

        <form action="second-green.html">

            <div class="form-row">
                <label>Username:</label>
                <input type="text" required>
            </div>

            <div class="form-row">
                <label>Password:</label>
                <input type="password" required>
            </div>

            <div class="buttons">
                <input type="submit" value="Login">
                <input type="reset" value="Reset">
            </div>

        </form>

    </div>

</div>

<div id="footer">
    <p>© 2026 Student Registration Portal</p>
</div>

</body>

</html>
