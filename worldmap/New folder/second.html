            <div class="form-row">

                <input type="text" required>
            </div>

                <label>Enter Your Password:</label>
                <input type="password" required>

            <div class="form-row">

                <input type="radio" name="gender"> Male

            </div>

            <div class="form-row">
                <label>Country:</label>
                <select>
                    <option>Pakistan</option>
                    <option>India</option>

                    <option>USA</option>
                </select>
            </div>

            <div class="form-row">
                <label>License / Terms:</label>
                <br>

                <textarea rows="7" cols="35" readonly>
1. I will provide correct information.
2. I will keep my password secure.
3. I will not share my login details with others.
4. I will use this portal for educational purposes only.
5. I agree to follow the portal rules.

            </div>

            <div class="form-row">
                <input type="checkbox" required>
                I agree with license

            <div class="buttons">
                <input type="submit" value="Register">
