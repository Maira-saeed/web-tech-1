
<html>

<head>
    <title>Registration Page</title>
</head>

<body style="background-color: #f5f7fa;">

<header style="background-color: #2c3e50; color: white; text-align: center; padding: 15px;">
    <h1>Student Registration Portal</h1>
</header>

<hr>

<h2 style="color: #2c3e50; text-align: center;">Registration</h2>

<form action="third.html" style="background-color: white; padding: 20px; width: 400px; margin: auto;">

    <label>Login Name:</label>
    <input type="text" required>

    <br><br>

    <label>Enter Your Password:</label>
    <input type="password" required>

    <br><br>

    <label>Re-enter Your Password:</label>
    <input type="password" required>

    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female

    <br><br>

    <label>Country:</label>
    <select>
        <option>Pakistan</option>
        <option>India</option>
        <option>China</option>
        <option>USA</option>
    </select>

    <br><br>

   <label>License / Terms:</label>
<br>
<textarea rows="7" cols="35" readonly>
1. I will provide correct information.
2. I will keep my password secure.
3. I will not share my login details with others.
4. I will use this portal for educational purposes only.
5. I agree to follow the portal rules.
6. I understand that incorrect information may affect my registration.
</textarea>

    <br><br>

    <input type="checkbox" required>
    I agree with license

    <br><br>

    <input type="submit" value="Register" style="background-color: #3498db; color: white; padding: 8px 20px;">

    <input type="reset" value="Reset" style="background-color: #95a5a6; color: white; padding: 8px 20px;">

</form>

<br><br><br><br><br><br>

<footer style="background-color: #2c3e50; color: white; text-align: center; padding: 15px;">
    <p>© 2026 Student Registration Portal</p>
</footer>

</body>

</html>
