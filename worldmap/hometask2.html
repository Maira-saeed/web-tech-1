<body bgcolor="lightblue">

<center>

<h1>World Map</h1>

<img src="image/worldmap.jpg"

     width="900"

<map name="worldmap">

<area

    shape="rect"
    coords="250,220,500,550"
    href="southamerica.html"
    alt="South America">

</map>

</center>

</body>

</html>
